<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>EAScinema</title>
    <style>
      :root {
        --o: #ff7900;
        --b: #111217;
        --g: #f5f5f6;
        --x: #2674c9;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--g);
        font: 15px Arial;
        color: #222;
      }
      /* Keep the navigation and date bar available while browsing any page. */
      header {
        position: sticky;
        top: 0;
        z-index: 100;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
        border: 0;
      }
      .top {
        background: var(--b);
        border-bottom: 4px solid var(--o);
      }
      nav,
      .sub,
      .wrap {
        max-width: 1200px;
        margin: auto;
        padding-left: 22px;
        padding-right: 22px;
      }
      nav {
        height: 76px;
        display: flex;
        align-items: center;
        gap: 30px;
        position: relative;
      }
      .logo {
        color: #fff;
        display: grid;
        grid-template-columns: auto auto;
        align-items: baseline;
        column-gap: 2px;
        width: fit-content;
        font-size: 27px;
        font-weight: 900;
        letter-spacing: -1px;
        line-height: 0.85;
        text-transform: uppercase;
      }
      .logo small {
        grid-column: 1 / -1;
        color: #bcbec5;
        font-size: 8px;
        font-weight: 700;
        letter-spacing: 2px;
        line-height: 1;
        margin-bottom: 4px;
      }
      .logo b,
      .links button:hover {
        color: var(--o);
      }
      .links {
        display: flex;
        gap: 22px;
        flex: 1;
      }
      .mobile-toggle { display:none; background:transparent; border:0; color:#fff; font-size:22px; width:44px; height:44px; border-radius:8px; }
      .mobile-toggle svg { color:#fff; }
      .mobile-toggle:focus { outline:2px solid #fff3; border-radius:8px; }
      @media (max-width: 760px) {
        .mobile-toggle {
          display: inline-grid;
          place-items: center;
          width: 40px;
          height: 40px;
          border: 2px solid var(--o);
          border-radius: 50%;
        }
      }
      .mobile-menu { display:none; position:fixed; top:62px; left:8px; right:8px; z-index:70; background:#fff; border-radius:10px; box-shadow:0 18px 50px #0006; padding:8px; border:1px solid #e7e9ee; transform:translateY(-6px); opacity:0; }
      .mobile-menu button { display:block; width:100%; padding:12px 14px; text-align:left; background:transparent; border:0; font-weight:800; color:#222; border-radius:8px; }
      .mobile-menu button:hover { background:#fff7ef; }
      .mobile-menu .nav-row { display:flex; gap:8px; }
      .mobile-menu .small-note { font-size:12px; color:#6b7178; padding:6px 12px; }
      .mobile-menu { transition: transform .22s ease, opacity .22s ease; transform-origin: top center; }
      .mobile-menu.open { transform:translateY(0); opacity:1; }
      .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 66; display: none; }
      .cta { display:inline-flex; align-items:center; gap:8px; }
      .cta .cta-icon { display:inline-grid; place-items:center; width:18px; height:18px; }
      /* header order on small screens: group controls to the right */
      @media (max-width: 760px) {
        .logo { order: 1; }
        .links { order: 2; }
        .cta { order: 3; }
        /* Left-to-right: avatar, notifications, then the menu button. */
        .avatar-wrap { order: 4; margin-left:auto; margin-right:0; }
        .notification-wrap { order: 5; margin-left:0; margin-right:0; }
        .mobile-toggle { order: 6; margin-left:0; margin-right:2px; }
        nav { gap: 10px; align-items: center; }
        .notification-wrap, .avatar-wrap, .mobile-toggle { display:inline-flex; }
      }
      /* compact admin on small screens */
      @media (max-width: 760px) {
        .admin-shell { grid-template-columns: 1fr; gap:12px; }
        .admin-nav { padding:8px; border-radius:10px; display:flex; gap:8px; overflow:auto; }
        .admin-nav button { padding:8px 10px; font-size:13px; white-space:nowrap; }
        .admin-page-head h2 { font-size:18px; }
        .stat { padding:12px; min-height:80px; }
        .overview-panels { grid-template-columns:1fr; }
        #admin .table th, #admin .table td { padding:8px; font-size:13px; }
      }
      @media (max-width: 420px) {
        .admin-nav button { padding:7px 9px; font-size:12px; }
        .admin-page-head h2 { font-size:16px; }
        .mobile-menu { top:58px; left:6px; right:6px; }
        .notification-menu { top:58px; left:6px; right:6px; width:auto; }
      }
      /* make hamburger dropdown a compact adjacent menu on small screens */
      @media (max-width: 760px) {
        .mobile-menu { position: absolute; right: 120px; top: 64px; left: auto; width: min(260px, calc(100vw - 140px)); z-index:78; transform: translateY(-6px); opacity:0; }
        .mobile-menu.open { transform: translateY(0); opacity:1; }
      }
      .mobile-menu .cta { width:100%; border-radius:8px; }
      .links button {
        background: none;
        color: #fff;
        font-weight: bold;
      }
      .cta {
        background: var(--o);
        padding: 10px 14px;
        font-weight: bold;
        border-radius: 5px;
      }
      #topLogout { border-color:#ff9b96; background:#fff7f6; color:#9d2525; font-weight:bold; transition:background .18s,color .18s,border-color .18s,transform .18s; }
      #topLogout:hover { background:#b52d2d; color:#fff; border-color:#b52d2d; transform:translateY(-1px); }
      .logout-cta { background:#a92a2a; color:#fff; transition:background .18s,transform .18s; }
      .logout-cta:hover { background:#7f1d1d; transform:translateY(-1px); }
      .datebar {
        background: #34353a;
      }
      .sub {
        display: flex;
        align-items: center;
        height: 34px;
        color: #eee;
        font-size: 12px;
        font-weight: 700;
      }
      .sub::before {
        content: "TODAY";
        color: var(--o);
        font-size: 10px;
        letter-spacing: 1px;
        margin-right: 10px;
      }
      .wrap {
        min-height: calc(100vh - 150px);
        padding-top: 32px;
        padding-bottom: 58px;
      }
      .view {
        display: none;
      }
      .view.active {
        display: block;
      }
      .hero {
        background:
          linear-gradient(90deg, #111d, #1112),
          url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1400&q=80")
            center/cover;
        color: #fff;
        min-height: 260px;
        border-radius: 10px;
        padding: 48px;
        display: flex;
        align-items: end;
        margin-bottom: 34px;
      }
      .hero h1 {
        font-size: 38px;
        margin: 0;
      }
      .title {
        border-bottom: 2px solid var(--o);
        padding-bottom: 10px;
        font-size: 22px;
      }
      .grid {
        display: grid;
        /* slightly wider tiles and centered layout */
        grid-template-columns: repeat(auto-fill, 260px);
        gap: 24px;
        align-items: start;
        justify-content: center;
        max-width: 1360px;
        margin: 0 auto;
        padding-left: 6px;
        padding-right: 6px;
      }
      .card { width:260px; display:flex; flex-direction:column; }
      .card,
      .box {
        background: #fff;
        border-radius: 9px;
        box-shadow: 0 5px 18px #0001;
        overflow: hidden;
      }
      /* Ensure poster images are consistently sized and not stretched */
      .poster {
        width:100%;
        /* A fixed portrait frame keeps every artwork tile the same height.
           `cover` crops gently when an uploaded image is not poster-shaped. */
        aspect-ratio: 2 / 3;
        overflow: hidden;
        background-position: center;
        background-size: cover;
        background-repeat: no-repeat;
      }
      /* The card's content area */
      .card div:last-child {
        padding: 14px;
        display:flex;
        flex-direction:column;
        gap:8px;
        flex:1 1 auto;
      }
      .card h3 {
        margin: 0;
        font-size: 16px;
        line-height: 1.2;
        /* Reserve room for two lines so cards stay level when titles vary. */
        min-height: 2.4em;
        display: -webkit-box;
        line-clamp: 2;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .meta {
        font-size: 12px;
        color: #666;
      }
      .book {
        width: 100%;
        background: var(--b);
        color: #fff;
        padding: 10px;
        font-weight: bold;
        border-radius: 4px;
        margin-top: auto;
      }
      .book:hover,
      .primary {
        background: var(--o);
        color: #111;
      }
      .primary {
        padding: 11px 16px;
        font-weight: bold;
        border-radius: 5px;
      }
      .detail,
      .bookgrid {
        display: grid;
        gap: 28px;
        padding: 28px;
      }
      .detail {
        grid-template-columns: 280px 1fr;
      }
      .bookgrid {
        grid-template-columns: minmax(520px, 1.08fr) minmax(360px, 0.92fr);
        align-items: start;
      }
      .detailposter {
        width:100%;
        aspect-ratio: 2 / 3;
        height: auto;
        max-height: 640px;
        background-position: center;
        background-size: cover;
        border-radius: 6px;
      }
      /* strong selector to ensure poster tiles use portrait sizing */
      .card > .poster, .grid .poster {
        aspect-ratio: 2 / 3;
        background-size: cover !important;
        background-position: center !important;
        display: block !important;
      }
      .heading {
        background: #fff0df;
        padding: 17px;
        border-left: 5px solid var(--o);
        margin: 0;
      }
      .schedule {
        background: #fff5e9;
        padding: 17px;
        margin-top: 20px;
      }
      .choice {
        padding: 9px 13px;
        border: 1px solid #ccc;
        border-radius: 5px;
        background: #fff;
        margin: 0;
      }
      .schedule #days,
      .schedule #times {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }
      .schedule #times {
        margin-top: 8px;
      }
      .schedule #next {
        display: block;
        margin-top: 14px;
      }
      .choice.selected {
        background: var(--o);
        border-color: var(--o);
      }
      .primary:disabled {
        background: #aaa;
      }
      .seatbox {
        padding: 25px;
        min-width: 0;
      }
      .screen {
        background: linear-gradient(90deg, #555, #ddd, #555);
        text-align: center;
        color: #fff;
        padding: 10px;
        border-radius: 60% 60% 4px 4px;
        font-weight: bold;
      }
      .plan {
        max-width: 680px;
        margin: 28px auto;
        min-width: 0;
      }
      .row {
        display: grid;
        grid-template-columns: 24px minmax(0, 1fr) 30px minmax(0, 1fr);
        gap: 8px;
        align-items: center;
        margin: 8px 0;
      }
      .sets {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 7px;
        min-width: 0;
      }
      .seat {
        height: 31px;
        min-width: 0;
        background: #ff8a17;
        border-radius: 7px 7px 3px 3px;
        border-bottom: 4px solid #b85000;
        font-size: 10px;
        font-weight: bold;
      }
      .seat.selected {
        background: var(--x);
        color: #fff;
        border-bottom-color: #07519d;
      }
      .seat.occupied {
        background: #777;
        color: #ddd;
        border-bottom-color: #444;
        cursor: not-allowed;
      }
      .legend,
      .hint {
        text-align: center;
      }
      .dot {
        display: inline-block;
        width: 13px;
        height: 13px;
        border-radius: 3px;
        margin: 0 4px 0 13px;
      }
      .form {
        padding: 25px;
      }
      .field {
        margin-bottom: 14px;
      }
      .field label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
      }
      .field input,
      .field select {
        width: 100%;
        padding: 10px;
        border: 1px solid #d5d6db;
        border-radius: 5px;
      }
      .field input[type="checkbox"] { width:auto; padding:0; margin:0; accent-color:var(--o); }
      .field label.small { display:flex; align-items:center; gap:7px; margin-top:8px; font-weight:normal; cursor:pointer; }
      .movie-search { position:relative; }
      .movie-search::before { content:"⌕"; position:absolute; z-index:1; left:12px; top:50%; transform:translateY(-50%); color:#777d87; font-size:23px; line-height:1; pointer-events:none; }
      .movie-search input { padding-left:39px !important; }
      .line {
        display: flex;
        justify-content: space-between;
        padding: 5px 0;
      }
      .summary {
        border-top: 1px solid #ddd;
        margin-top: 12px;
        padding-top: 10px;
      }
      .grand {
        font-size: 20px;
        font-weight: bold;
        color: #d65e00;
      }
      .notice {
        padding: 11px;
        margin-top: 13px;
        border-radius: 5px;
      }
      .error {
        background: #ffe3e1;
        color: #922;
      }
      .success {
        background: #dff4e7;
        color: #176;
      }
      .auth {
        max-width: 450px;
        margin: 35px auto;
      }
      .auth h1 {
        text-align: center;
      }
      .payment-card {
        max-width: 760px;
        margin: 8px auto;
        padding: 0;
        overflow: hidden;
      }
      .payment-head {
        background: linear-gradient(135deg, #111217, #31343c);
        color: #fff;
        padding: 28px 32px;
      }
      .payment-head h1 {
        margin: 0 0 6px;
        font-size: 27px;
      }
      .payment-body {
        display: grid;
        grid-template-columns: 1fr 250px;
        gap: 28px;
        padding: 30px 32px;
        align-items: center;
      }
      .payment-amount {
        color: var(--o);
        font-size: 32px;
        font-weight: 900;
        margin: 8px 0;
      }
      .receipt-card {
        max-width: 680px;
        margin: 12px auto;
        overflow: hidden;
      }
      .receipt-banner {
        background: linear-gradient(135deg, #111217, #30343d);
        color: #fff;
        padding: 27px 31px;
        border-bottom: 4px solid var(--o);
      }
      .receipt-banner h1 {
        margin: 5px 0 0;
        font-size: 28px;
      }
      .receipt-body {
        padding: 27px 31px 30px;
      }
      .receipt-reference {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #fff4e8;
        border-radius: 7px;
        padding: 12px 14px;
        margin: 17px 0;
      }
      .receipt-reference b {
        color: #bd5700;
      }
      .receipt-details {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px 24px;
        margin: 18px 0;
      }
      .receipt-details span {
        display: block;
        color: #71757e;
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      .receipt-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 21px;
      }
      .receipt-actions .choice {
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }
      .qr-wrap {
        background: #fff;
        border: 1px solid #e2e2e4;
        border-radius: 10px;
        padding: 12px;
        text-align: center;
        box-shadow: 0 4px 14px #00000010;
      }
      .qr-wrap img {
        display: block;
        width: 100%;
        aspect-ratio: 1;
      }
      .qr-wrap small {
        color: #666;
      }
      @media (max-width: 600px) {
        .payment-body {
          grid-template-columns: 1fr;
        }
        .qr-wrap {
          max-width: 240px;
          margin: auto;
        }
        .receipt-details {
          grid-template-columns: 1fr;
        }
      }
      /* Responsive tweaks for medium and small screens */
      @media (max-width: 760px) {
        /* Make notification and avatar menus compact and anchored near their buttons
           We'll position them dynamically via JS so they always appear under their icons */
        .notification-menu, .avatar-menu, .mobile-menu {
          position: absolute;
          top: 64px;
          z-index: 80;
          transform: translateY(-6px);
          opacity: 0;
          transition: transform .18s ease, opacity .18s ease;
          width: min(320px, calc(100vw - 40px));
          max-height: 60vh;
          left: auto;
          right: auto;
        }
        .notification-menu.open, .avatar-menu.open, .mobile-menu.open { transform: translateY(0); opacity:1; }
        .notification-menu { box-shadow: 0 12px 32px #0006; }
      }
      @media (max-width: 420px) {
        .hero h1 { font-size: 22px; }
        .notification-count { right:-6px; top:-6px; }
        .avatar-btn { width:34px; height:34px; }
        /* on very narrow screens allow menus to occupy centered width */
        .avatar-menu { right:6px; left:6px; top:64px; }
        .notification-menu { right:6px; left:6px; top:64px; }
        .mobile-menu { right:6px; left:6px; top:64px; width: calc(100% - 12px); }
      }
      .small {
        font-size: 12px;
        color: #666;
      }
      .table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
      }
      .table th,
      .table td {
        padding: 11px;
        border-bottom: 1px solid #ddd;
        text-align: left;
      }
      .table th {
        background: #222;
        color: #fff;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
      }
      .stat {
        background: #fff;
        padding: 18px;
        border-radius: 8px;
      }
      .stat b {
        display: block;
        color: var(--o);
        font-size: 26px;
      }
      .admin-grid { display:grid; grid-template-columns: 360px 1fr; gap:20px; align-items:start; margin:22px 0; }
      .admin-section { margin-top:28px; }
      .admin-actions { display:flex; flex-wrap:wrap; gap:7px; }
      .admin-actions button { padding:7px 9px; font-size:12px; }
      .danger { background:#a92a2a; color:#fff; }
      .muted { color:#68707a; font-size:12px; }
      .badge { display:inline-block; padding:4px 7px; border-radius:999px; background:#fff1df; color:#a94e00; font-size:11px; font-weight:bold; }
      .modal-backdrop { position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; padding:20px; background:#111a; }
      .modal { width:min(560px,100%); max-height:calc(100vh - 40px); overflow:auto; background:#fff; border-radius:10px; box-shadow:0 18px 55px #0007; }
      .modal-head { display:flex; align-items:center; justify-content:space-between; padding:18px 22px; background:#111217; color:#fff; border-bottom:4px solid var(--o); }
      .modal-head h2 { margin:0; font-size:20px; }
      .modal-close { background:transparent; color:#fff; font-size:25px; line-height:1; }
      .admin-shell { display:grid; grid-template-columns:220px minmax(0,1fr); gap:22px; align-items:start; margin-top:22px; }
      .admin-nav { background:linear-gradient(165deg,#1d2028,#0d0f14); border-radius:14px; padding:12px; position:sticky; top:16px; box-shadow:0 14px 30px #10121728; }
      .admin-nav::before { content:"EAS MANAGEMENT"; display:block; padding:10px 12px 16px; color:#ff9b45; font-size:10px; font-weight:800; letter-spacing:1.4px; }
      .admin-nav button { width:100%; padding:12px; text-align:left; color:#d8d9df; background:transparent; border-radius:8px; font-weight:bold; transition:background .18s,color .18s,transform .18s; }
      .admin-nav button:hover { background:#ffffff14; color:#fff; transform:translateX(2px); }
      .admin-nav button.active { background:linear-gradient(135deg,#ff8b20,#ff6900); color:#111; box-shadow:0 5px 12px #ff760044; }
      .admin-page-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:22px; padding:4px 0 15px; border-bottom:1px solid #e2e5eb; }
      .admin-page-head h2 { margin:0; font-size:25px; letter-spacing:-.4px; }
      .admin-page-head .muted { margin:6px 0 0; font-size:13px; }
      #admin > .title { margin:0; padding:0 0 15px; border-bottom:0; font-size:25px; letter-spacing:-.5px; }
      .stats { gap:16px; }
      .stat { position:relative; overflow:hidden; min-height:108px; padding:20px; border:1px solid #edf0f4; border-radius:12px; box-shadow:0 8px 20px #1d27330c; }
      .stat::after { content:""; position:absolute; width:64px; height:64px; border-radius:50%; right:-21px; top:-23px; background:#fff0e1; }
      .stat:nth-child(2)::after { background:#e8f1ff; }
      .stat:nth-child(3)::after { background:#e5f8ee; }
      .stat:nth-child(4)::after { background:#fff0f0; }
      .stat b { position:relative; z-index:1; margin-bottom:7px; color:#f46d00; font-size:28px; letter-spacing:-.5px; }
      .stat:nth-child(3) b { color:#16854d; }
      .overview-panels { display:grid; grid-template-columns:1.15fr .85fr; gap:16px; margin-top:22px; }
      .overview-card { background:#fff; border:1px solid #edf0f4; border-radius:12px; padding:20px; box-shadow:0 8px 20px #1d27330c; }
      .overview-card h3 { margin:0 0 8px; font-size:16px; }
      .queue-row { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-top:1px solid #edf0f4; }
      .queue-row:first-of-type { border-top:0; }
      .queue-row b { font-size:18px; }
      #admin .table { border:1px solid #e8ebf0; border-radius:12px; overflow:hidden; box-shadow:0 8px 20px #1d273308; }
      #admin .table th { background:#20232b; padding:13px 14px; font-size:12px; letter-spacing:.2px; }
      #admin .table td { padding:14px; vertical-align:middle; }
      #admin .table tr:last-child td { border-bottom:0; }
      #admin .table tbody tr:hover { background:#fffaf5; }
      #admin .choice { border-color:#d7dce4; font-weight:bold; }
      #admin .primary, #admin .danger { border-radius:6px; font-weight:bold; }

      .notification-menu { position:absolute; right:0; top:47px; z-index:30; width:min(380px,calc(100vw - 30px)); max-height:460px; overflow:auto; background:#fff; color:#1f232b; border-radius:12px; box-shadow:0 16px 42px #0004; border:1px solid #e7e9ee; }

    <header>

              <span class="notification-count" id="notificationCount" style="display:none">0</span>

    <script>
      const films = [
        [
          "spider-man-brand-new-day",

        ],

          "Odysseus begins an epic journey home through myth and war.",

        [

        [

          290,
          "https://m.media-amazon.com/images/M/MV5BNTkwNzJiYTctNzI3NC00NjE1LTlhYjktY2Q5MTdmMWFmNzcxXkEyXkFqcGc@._V1_.jpg",
          "A lone astronaut races to save Earth and discovers an unexpected ally.",
        ],
        [
          "obsession",
          "Obsession",
          "Horror",
          "1h 49m",
          "R-13",
          260,
          "https://m.media-amazon.com/images/M/MV5BYzc1NWUwMDgtNGZlMS00ZmYzLWIzMzktNmMxMmY1MTUzNWExXkEyXkFqcGc@._V1_.jpg",
          "A wish for true love turns into a terrifying obsession.",
        ],
      ];
      const future = [
        [
          "Hope",
          "Thriller, Sci-Fi",
          "Coming September",
          "https://m.media-amazon.com/images/M/MV5BZjE3ZDI0MmItMDIyMC00NzU2LTk2OTQtZTUxYTlkMjlkNmY3XkEyXkFqcGc@._V1_.jpg",
        ],

        ],
      ];
      let film,
        day,
        show,
        seats = [];
      const get = (k, d = []) =>
          JSON.parse(localStorage.getItem(k) || JSON.stringify(d)),
        put = (k, v) => localStorage.setItem(k, JSON.stringify(v));
      const money = (value) => `₱${Number(value || 0).toFixed(2)}`;
      function addNotification(recipient, title, message, destination, payload = null) {
        const items = get("easNotifications");
        items.unshift({ id:`notice-${Date.now()}-${Math.random().toString(36).slice(2,6)}`, recipient, title, message, destination, payload, read:false, createdAt:new Date().toLocaleString("en-PH") });
        put("easNotifications", items.slice(0,100));
        renderNotificationButton();
        // ensure menus are closed when account state changes
        try { const nm = document.getElementById('notificationMenu'); if(nm){ nm.style.display='none'; nm.classList.remove('open'); } } catch(e){}
        try { const am = document.getElementById('avatarMenu'); if(am){ am.style.display='none'; am.classList.remove('open'); } } catch(e){}
      }
      function notificationsFor(user) { return get("easNotifications").filter(n => n.recipient === (user.role === "admin" ? "admin" : user.email)); }
      function renderNotificationButton() {
        const user=get("easSession",null), wrap=document.getElementById("notificationWrap"), count=document.getElementById("notificationCount");
        if (!wrap || !count) return;
        wrap.style.display=user ? "block" : "none";
        if (!user) return;
        const unread=notificationsFor(user).filter(n=>!n.read).length;
        count.textContent=unread>99?"99+":unread;
        count.style.display=unread?"block":"none";
      }
      function toggleNotifications() {
        const user=get("easSession",null), menu=document.getElementById("notificationMenu");
        if(!user || !menu)return;
        const items=notificationsFor(user);
        const rows = items.length ? items.map(n => {
          const wrapperOpen = `<div class="notification-item ${n.read?'':'unread'}" onclick="event.stopPropagation(); openNotification('${n.id}')">`;
          const base = `${wrapperOpen}<b>${n.title}</b><small>${n.message}</small><small>${n.createdAt}</small>`;
          if (n.payload && n.destination === 'bookings' && user.role !== 'admin') {
            // actionable booking notification for customer
            return base + `<div style="margin-top:8px;display:flex;gap:8px"><button class="primary" onclick="event.stopPropagation(); acceptNotification('${n.id}')">Accept</button><button class="choice" onclick="event.stopPropagation(); declineNotification('${n.id}')">Decline</button></div></div>`;
          }
          return base + `</div>`;
        }).join('') : '<div class="notification-empty">You are all caught up.</div>';
        menu.innerHTML = `<header><b>Notifications</b><button class="choice" onclick="event.stopPropagation(); markAllNotificationsRead()">Mark all read</button></header>${rows}`;
        // ensure other menus are closed to avoid overlap on small screens
        try { const am = document.getElementById('avatarMenu'); if (am) { am.style.display='none'; am.classList.remove('open'); } } catch(e){}
        try { const mm = document.getElementById('mobileMenu'); if (mm) { mm.style.display='none'; mm.classList.remove('open'); } } catch(e){}
        const shown = menu.style.display === 'block';
        if (shown) { menu.style.display = 'none'; menu.classList.remove('open'); hideBackdrop(); }
        else {
          // position menu under the notification button before showing
          const btn = document.querySelector('#notificationWrap .notification-btn');
          positionMenu(menu, btn);
          menu.style.display = 'block'; setTimeout(()=>menu.classList.add('open'),10);
          showBackdrop();
        }
      }

      function acceptNotification(id) {
        const user = get('easSession', null);
        if (!user) return;
        const items = get('easNotifications');
        const note = items.find(n => n.id === id);
        if (!note || !note.payload) return;
        // handle reschedule payload
        if (note.payload.type === 'reschedule') {
          const bookings = get('easBookings');
          const b = bookings.find(x => x.ref === note.payload.ref);
          if (b) {
            b.date = note.payload.date;
            b.time = note.payload.time;
            b.key = note.payload.key;
            b.rescheduledAt = new Date().toLocaleString('en-PH');
            delete b.pendingReschedule;
            put('easBookings', bookings);
            addNotification('admin', 'Reschedule accepted', `${b.name} accepted reschedule for ${b.ref}.`, 'bookings');
          }
        }
        note.read = true;
        put('easNotifications', items);
        const __nm = document.getElementById('notificationMenu'); if(__nm){ __nm.style.display='none'; __nm.classList.remove('open'); }
        renderNotificationButton();
        renderBookings();
      }

      function declineNotification(id) {
        const items = get('easNotifications');
        const note = items.find(n => n.id === id);
        if (!note) return;
        if (note.payload && note.payload.type === 'reschedule') {
          // inform admin that user declined
          addNotification('admin', 'Reschedule declined', `${note.recipient} declined proposed reschedule for ${note.payload.ref}.`, 'bookings');
        }
        note.read = true;
        put('easNotifications', items);
        const __nm2 = document.getElementById('notificationMenu'); if(__nm2){ __nm2.style.display='none'; __nm2.classList.remove('open'); }
        renderNotificationButton();
      }
      function markAllNotificationsRead() { const user=get("easSession",null), items=get("easNotifications"); items.forEach(n=>{if(n.recipient===(user.role==="admin"?"admin":user.email))n.read=true}); put("easNotifications",items); const nm=document.getElementById("notificationMenu"); if(nm){ nm.style.display="none"; nm.classList.remove('open'); } renderNotificationButton(); }
      function openNotification(id) { const user=get("easSession",null), items=get("easNotifications"), note=items.find(n=>n.id===id); if(!note||!user)return; note.read=true; put("easNotifications",items); const nm=document.getElementById("notificationMenu"); if(nm){ nm.style.display="none"; nm.classList.remove('open'); } renderNotificationButton(); if(user.role==="admin") { window.adminTab=note.destination||"overview"; admin(); } else if(note.destination==="bookings") go("search"); else openSettings(); }
      function syncMovies() {
        const savedNow = get("easMoviesNow", null);
        const savedSoon = get("easMoviesSoon", null);
        const oakStreetPoster = films.find((movie) => movie[0] === "oak-street")[6];
        const oldDemoIds = new Set(["space", "case", "summit", "signal", "afterglow", "velocity", "orbit", "perfect"]);
        const hasOldDemoCatalog = savedNow?.some((movie) => oldDemoIds.has(movie[0]));
        if (savedNow && !hasOldDemoCatalog) {
          savedNow.forEach((movie) => {
            if (movie[0] === "oak-street") movie[6] = oakStreetPoster;
          });
          films.splice(0, films.length, ...savedNow);
          put("easMoviesNow", savedNow);
        }
        else put("easMoviesNow", films);
        const hasOldDemoSoon = savedSoon?.some((movie) => ["Echoes of Summer", "Titan Force", "The Wild Road", "Velvet Curtain"].includes(movie[0]));
        if (savedSoon && !hasOldDemoSoon) future.splice(0, future.length, ...savedSoon);
        else put("easMoviesSoon", future);
      }
      function go(x) {
        document
          .querySelectorAll(".view")
          .forEach((v) => v.classList.remove("active"));
        document.getElementById(x).classList.add("active");
        if (x === "search") renderBookings();
        scrollTo(0, 0);
      }
      function init() {
        today.textContent = new Date().toLocaleDateString("en-PH", {
          weekday: "long",
          month: "long",
          day: "numeric",
          year: "numeric",
        });
        if (!get("easUsers").length)
          put("easUsers", [
            {
              name: "EAS Admin",
              email: "admin@eascinema.com",
              password: "admin123",
              role: "admin",
            },
          ]);
        syncMovies();
        searchNowShowing("");
        searchComingSoon("");
        setAccount();
        // close menus when clicking outside (notifications, avatar, mobile menu)
        document.addEventListener('click', function (e) {
          const notifWrap = document.getElementById('notificationWrap');
          const avatarWrap = document.getElementById('avatarWrap');
          const notifMenu = document.getElementById('notificationMenu');
          const avatarMenu = document.getElementById('avatarMenu');
          const mobileMenu = document.getElementById('mobileMenu');
          const mobileBtn = document.getElementById('mobileMenuBtn');
          // if click is outside notification wrap, close notification menu
          if (notifMenu && notifWrap && !notifWrap.contains(e.target)) { notifMenu.style.display = 'none'; notifMenu.classList.remove('open'); }
          // if click is outside avatar wrap, close avatar menu
          if (avatarMenu && avatarWrap && !avatarWrap.contains(e.target)) { avatarMenu.style.display = 'none'; avatarMenu.classList.remove('open'); }
          // if click outside mobile menu and button, close mobile menu
          if (mobileMenu && mobileBtn && !mobileMenu.contains(e.target) && !mobileBtn.contains(e.target)) { mobileMenu.style.display = 'none'; mobileMenu.classList.remove('open'); }
        });
        // stop clicks on control buttons from bubbling to document (prevents immediate close)
        try {
          const p = document.getElementById('profileBtn'); if (p) { p.addEventListener('click', e => e.stopPropagation()); p.addEventListener('touchstart', e => e.stopPropagation()); }
          const n = document.querySelector('#notificationWrap .notification-btn'); if (n) { n.addEventListener('click', e => e.stopPropagation()); n.addEventListener('touchstart', e => e.stopPropagation()); }
          const mbtn = document.getElementById('mobileMenuBtn'); if (mbtn) { mbtn.addEventListener('click', e => e.stopPropagation()); mbtn.addEventListener('touchstart', e => e.stopPropagation()); }
        } catch (e) {}

        // also bind backdrop clicks here (ensure handler in same scope)
        try { const back = document.getElementById('mobileBackdrop'); if (back) { back.addEventListener('click', function(e){ e.stopPropagation(); closeAllMenus(); }); back.addEventListener('touchstart', function(e){ e.stopPropagation(); closeAllMenus(); }); } } catch(e) {}

        // reposition open menus on resize/scroll so they stay aligned with their icons
        function repositionOpenMenus() {
          try {
            const nm = document.getElementById('notificationMenu'); if (nm && nm.style.display === 'block') positionMenu(nm, document.querySelector('#notificationWrap .notification-btn'));
            const am = document.getElementById('avatarMenu'); if (am && am.style.display === 'block') positionMenu(am, document.querySelector('#avatarWrap .avatar-btn'));

        document.addEventListener('click', function(e){

      // position a dropdown menu under its trigger button and ensure it fits the viewport
      function positionMenu(menu, button) {
        if (!menu || !button) return;
        // desired width: same as CSS min(320px, calc(100vw - 40px))
        const vw = Math.max(document.documentElement.clientWidth || 320, window.innerWidth || 320);
        const desired = Math.min(320, Math.max(200, vw - 40));
        menu.style.width = desired + 'px';
        // position fixed so dropdown is not clipped by parent containers and stays above backdrop
        menu.style.position = 'fixed';
        menu.style.zIndex = 1001;
        // measure button position
        const rect = button.getBoundingClientRect();
        // center menu on button (left relative to viewport)
        let left = Math.round(rect.left + rect.width / 2 - desired / 2);
        const pad = 10;
        if (left < pad) left = pad;
        if (left + desired > vw - pad) left = Math.max(pad, vw - desired - pad);
        menu.style.left = left + 'px';
        // place menu vertically below the button (viewport coords)
        const top = Math.round(rect.bottom + 8);
        menu.style.top = top + 'px';
        // clear right to avoid CSS conflicts
        menu.style.right = 'auto';
        // add or position pointer element so menu visually points to the trigger
        try {
          let ptr = menu.querySelector('.menu-pointer');
          if (!ptr) { ptr = document.createElement('div'); ptr.className = 'menu-pointer'; menu.appendChild(ptr); }
          // pointer left relative to menu
          const btnCenter = rect.left + rect.width / 2;
          const menuLeft = left;
          let ptrLeft = Math.round(btnCenter - menuLeft - 6); // 6 = half pointer width
          const maxPtr = desired - 12; if (ptrLeft < 8) ptrLeft = 8; if (ptrLeft > maxPtr) ptrLeft = maxPtr;
          ptr.style.left = ptrLeft + 'px';
        } catch (e) {}
      }

        document.getElementById("admin").innerHTML = `<h2 class="title">ADMIN DASHBOARD</h2><p class="muted">Verify payment submissions, manage refund requests, update the movie catalogue, and track approved sales.</p>
        <div class="stats"><div class="stat"><b>${paid.length}</b>Paid bookings</div><div class="stat"><b>${a.length}</b>Total bookings</div><div class="stat"><b>${money(paid.reduce((s,x)=>s+x.total,0))}</b>Net sales</div><div class="stat"><b>${refunds.length}</b>Refund requests</div></div>
        <div class="admin-grid"><section class="box form"><h2 id="movieFormTitle">Add a movie</h2><input type="hidden" id="movieEditType"><input type="hidden" id="movieEditIndex"><div class="field"><label>Display status</label><select id="movieStatus"><option value="now">Now showing</option><option value="soon">Coming soon</option></select></div><div class="field"><label>Title</label><input id="movieTitle" maxlength="80"></div><div class="field"><label>Genre</label><input id="movieGenre" maxlength="80"></div><div class="field"><label>Duration / release message</label><input id="movieInfo" placeholder="2h 00m or Coming October"></div><div class="field"><label>Rating (now showing)</label><input id="movieRating" placeholder="PG"></div><div class="field"><label>Ticket price, PHP (now showing)</label><input id="moviePrice" type="number" min="1"></div><div class="field"><label>Poster image URL</label><input id="moviePoster" type="url" placeholder="https://..."></div><div class="field"><label>Synopsis (now showing)</label><input id="movieSynopsis"></div><button class="primary" onclick="saveMovie()">SAVE MOVIE</button> <button class="choice" onclick="clearMovieForm()">CLEAR</button><div id="movieMessage"></div></section><section><h2>Movie catalogue</h2><div style="overflow:auto"><table class="table"><thead><tr><th>Movie</th><th>Placement</th><th>Actions</th></tr></thead><tbody>${catalogue.map(({x,i,t})=>`<tr><td><b>${t==='now'?x[1]:x[0]}</b><br><small>${t==='now'?x[2]:x[1]}</small></td><td><span class="badge">${t==='now'?'Now showing':'Coming soon'}</span></td><td><div class="admin-actions"><button class="choice" onclick="editMovie('${t}',${i})">Edit</button><button class="danger" onclick="removeMovie('${t}',${i})">Remove</button></div></td></tr>`).join('')}</tbody></table></div></section></div>
        <section class="admin-section"><h2 class="title">PAYMENT APPROVALS <span class="badge">${pending.length} pending</span></h2><div style="overflow:auto"><table class="table"><thead><tr><th>Reference</th><th>Customer</th><th>Payment proof</th><th>Total</th><th>Decision</th></tr></thead><tbody>${pending.length ? pending.map(x=>`<tr><td>${x.ref}<br><small>${x.movie}</small></td><td>${x.name}<br><small>${x.email}</small></td><td>${x.payment}<br><small>${x.paymentReference||'No reference'}</small></td><td>${money(x.total)}</td><td><div class="admin-actions"><button class="primary" onclick="reviewPayment('${x.ref}',true)">Approve</button><button class="danger" onclick="reviewPayment('${x.ref}',false)">Decline</button></div></td></tr>`).join(''):'<tr><td colspan="5">No payments waiting for approval.</td></tr>'}</tbody></table></div></section>
        <section class="admin-section"><h2 class="title">CANCELLATIONS & REFUNDS <span class="badge">${refunds.length} requested</span></h2><div style="overflow:auto"><table class="table"><thead><tr><th>Reference</th><th>Customer / movie</th><th>Amount</th><th>Status</th><th>Decision</th></tr></thead><tbody>${refunds.length ? refunds.map(x=>`<tr><td>${x.ref}</td><td>${x.name}<br><small>${x.movie}</small></td><td>${money(x.total)} via ${x.payment}</td><td>${x.refund}</td><td><div class="admin-actions"><button class="primary" onclick="reviewRefund('${x.ref}',true)">Approve refund</button><button class="danger" onclick="reviewRefund('${x.ref}',false)">Decline</button></div></td></tr>`).join(''):'<tr><td colspan="5">No refund requests waiting for review.</td></tr>'}</tbody></table></div></section>
        <section class="admin-section"><h2 class="title">ALL BOOKINGS</h2><div style="overflow:auto"><table class="table"><thead><tr><th>Reference</th><th>Customer</th><th>Movie</th><th>Total</th><th>Payment / refund</th></tr></thead><tbody>${a.length ? a.map(x=>`<tr><td>${x.ref}</td><td>${x.name}<br><small>${x.email}</small></td><td>${x.movie}<br><small>${x.date} ${x.time}</small></td><td>${money(x.total)}</td><td><b>${x.paymentStatus||x.status}</b><br><small>${x.refund||'Not requested'}</small></td></tr>`).join(''):'<tr><td colspan="5">No bookings yet.</td></tr>'}</tbody></table></div></section>`;
        go("admin");
      }
      function openAddMovie() { document.body.insertAdjacentHTML('beforeend',`<div class="modal-backdrop" id="appModal" onclick="if(event.target===this)closeModal()"><section class="modal"><header class="modal-head"><h2>Add movie</h2><button class="modal-close" onclick="closeModal()" aria-label="Close">×</button></header><div class="form"><div class="field"><label>Display status</label><select id="movieStatus"><option value="now">Now showing</option><option value="soon">Coming soon</option></select></div><div class="field"><label>Title</label><input id="movieTitle" maxlength="80"></div><div class="field"><label>Genre</label><input id="movieGenre" maxlength="80"></div><div class="field"><label>Duration / release message</label><input id="movieInfo" placeholder="2h 00m or Coming October"></div><div class="field"><label>Rating (now showing)</label><input id="movieRating" placeholder="PG"></div><div class="field"><label>Ticket price, PHP (now showing)</label><input id="moviePrice" type="number" min="1"></div><div class="field"><label>Poster image URL</label><input id="moviePoster" type="url" placeholder="https://..."></div><div class="field"><label>Synopsis (now showing)</label><input id="movieSynopsis"></div><div id="movieMessage"></div><button class="primary" onclick="saveMovie()">SAVE MOVIE</button> <button class="choice" onclick="closeModal()">CANCEL</button></div></section></div>`); }
      function clearMovieForm() { [movieTitle,movieGenre,movieInfo,movieRating,moviePrice,moviePoster,movieSynopsis].forEach(x=>x.value=""); movieStatus.value="now"; movieMessage.innerHTML=""; }
      function editMovie(t,i) { const x=(t==='now'?films:future)[i], title=t==='now'?x[1]:x[0], genre=t==='now'?x[2]:x[1], info=t==='now'?x[3]:x[2], rating=t==='now'?x[4]:'' ,price=t==='now'?x[5]:'' ,poster=t==='now'?x[6]:x[3], synopsis=t==='now'?x[7]:''; document.body.insertAdjacentHTML('beforeend',`<div class="modal-backdrop" id="appModal" onclick="if(event.target===this)closeModal()"><section class="modal"><header class="modal-head"><h2>Edit movie</h2><button class="modal-close" onclick="closeModal()" aria-label="Close">×</button></header><div class="form"><div class="field"><label>Display status</label><select id="editMovieStatus"><option value="now">Now showing</option><option value="soon">Coming soon</option></select></div><div class="field"><label>Title</label><input id="editMovieTitle" value="${title}"></div><div class="field"><label>Genre</label><input id="editMovieGenre" value="${genre}"></div><div class="field"><label>Duration / release message</label><input id="editMovieInfo" value="${info}"></div><div class="field"><label>Rating (now showing)</label><input id="editMovieRating" value="${rating}"></div><div class="field"><label>Ticket price, PHP (now showing)</label><input id="editMoviePrice" type="number" min="1" value="${price}"></div><div class="field"><label>Poster image URL</label><input id="editMoviePoster" type="url" value="${poster}"></div><div class="field"><label>Synopsis (now showing)</label><input id="editMovieSynopsis" value="${synopsis}"></div><div id="editMovieMessage"></div><button class="primary" onclick="saveMovieEdit('${t}',${i})">SAVE CHANGES</button> <button class="choice" onclick="closeModal()">CANCEL</button></div></section></div>`); document.getElementById('editMovieStatus').value=t; }
      function saveMovieEdit(oldType,index) { const t=editMovieStatus.value,title=editMovieTitle.value.trim(),genre=editMovieGenre.value.trim(),info=editMovieInfo.value.trim(),poster=editMoviePoster.value.trim(),price=Number(editMoviePrice.value),rating=editMovieRating.value.trim(),synopsis=editMovieSynopsis.value.trim(); if(!title||!genre||!info||!poster||(t==='now'&&(!price||!rating))) { editMovieMessage.innerHTML='<div class="notice error">Complete all required fields. Rating and ticket price are required for now showing.</div>'; return; } const old=(oldType==='now'?films:future)[index], id=oldType==='now'?old[0]:`movie-${Date.now()}`; (oldType==='now'?films:future).splice(index,1); (t==='now'?films:future).push(t==='now'?[id,title,genre,info,rating,price,poster,synopsis]:[title,genre,info,poster]); put('easMoviesNow',films); put('easMoviesSoon',future); searchNowShowing(''); searchComingSoon(''); closeModal(); admin(); }
      function saveMovie() { const t=movieStatus.value,title=movieTitle.value.trim(),genre=movieGenre.value.trim(),info=movieInfo.value.trim(),poster=moviePoster.value.trim(),price=Number(moviePrice.value); if(!title||!genre||!info||!poster||(t==='now'&&(!price||!movieRating.value.trim()))) { movieMessage.innerHTML='<div class="notice error">Complete all required fields. Rating and ticket price are required for now showing.</div>'; return; } (t==='now'?films:future).push(t==='now'?[`movie-${Date.now()}`,title,genre,info,movieRating.value.trim(),price,poster,movieSynopsis.value.trim()]:[title,genre,info,poster]); put('easMoviesNow',films); put('easMoviesSoon',future); searchNowShowing(''); searchComingSoon(''); closeModal(); admin(); }
      function removeMovie(t,i) { const list=t==='now'?films:future,title=t==='now'?list[i][1]:list[i][0]; if(!confirm(`Remove “${title}”?`)) return; list.splice(i,1); put('easMoviesNow',films); put('easMoviesSoon',future); searchNowShowing(''); searchComingSoon(''); admin(); }
      function reviewPayment(ref,ok) { const a=get('easBookings'),b=a.find(x=>x.ref===ref); if(!b)return; b.paymentStatus=ok?'Approved':'Declined'; b.status=ok?'Confirmed':'Payment declined'; if(!ok)b.refund='Payment declined — no charge approved'; put('easBookings',a); if(b && b.email) addNotification(b.email, ok? 'Payment approved' : 'Payment declined', ok? `Your payment for ${b.movie} (${b.ref}) was approved.` : `Your payment for ${b.movie} (${b.ref}) was declined.`, 'bookings'); admin(); }
      function reviewRefund(ref,ok) { const a=get('easBookings'),b=a.find(x=>x.ref===ref); if(!b)return; b.refundStatus=ok?'Approved':'Declined'; b.refund=ok?`${money(b.total)} refund approved via ${b.payment}`:'Refund request declined'; put('easBookings',a); if(b && b.email) addNotification(b.email, ok? 'Refund approved' : 'Refund declined', ok? `Your refund for ${b.movie} (${b.ref}) was approved.` : `Your refund request for ${b.movie} (${b.ref}) was declined.`, 'bookings'); admin(); }
      function admin() {
        let u = get("easSession", null);
        if (!u || u.role !== "admin") {
          authform("login", "Admin access only.");
          go("auth");
          return;
        }
        let a = get("easBookings"),
          c = a.filter((x) => x.status === "Confirmed"),
          r = c.reduce((s, x) => s + x.total, 0);
        return renderAdminDashboard(a);
        admin.innerHTML = `<h2 class="title">ADMIN DASHBOARD</h2><div class="stats"><div class="stat"><b>${c.length}</b>Confirmed bookings</div><div class="stat"><b>${a.length}</b>Total bookings</div><div class="stat"><b>₱${r.toFixed(0)}</b>Revenue</div><div class="stat"><b>${a.filter((x) => x.status === "Cancelled").length}</b>Refund requests</div></div><div style="overflow:auto"><table class="table"><thead><tr><th>Reference</th><th>Customer</th><th>Movie / schedule</th><th>Seats</th><th>Total</th><th>Status</th></tr></thead><tbody>${a.length ? a.map((x) => `<tr><td>${x.ref}</td><td>${x.name}<br><small>${x.email}</small></td><td>${x.movie}<br><small>${x.date} ${x.time}</small></td><td>${x.seats.join(", ")}</td><td>₱${x.total.toFixed(2)}</td><td>${x.status}<br><small>${x.refund}</small></td></tr>`).join("") : '<tr><td colspan="6">No bookings yet.</td></tr>'}</tbody></table></div>`;
        go("admin");
      }
      init();
    </script>
  </body>
</html>
